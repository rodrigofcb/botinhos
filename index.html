<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2E1F47">
<meta name="description" content="Dois botinhos, um rosa e um caramelo, nadando por dez cidades para se encontrar. Para duas pessoas no mesmo celular.">
<title>Botinhos</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --ink:#2E1F47; color-scheme:dark; }
html,body{height:100%;margin:0;background:var(--ink);overflow:hidden;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
</style>
</head>
<body>
<canvas id="c" aria-label="Botinhos, jogo para duas pessoas no mesmo celular"></canvas>
<script>
"use strict";
(() => {
const cv = document.getElementById("c");
let ctx = cv.getContext("2d"); // "let": as silhuetas do álbum são desenhadas trocando o contexto por um canvas fora da tela
const C = {
  ink: "#2E1F47", rosa: "#FF8FBF", rosaB: "#FFD6E8", cara: "#E8A45A", caraB: "#FBE3BD",
  sky1: "#BBA6FF", sky2: "#FFD3C4", jac: "#9C7AE8", jac2: "#C6ABFF", ouro: "#FFD25A",
  obel: "#F4EFFF", red: "#FF6B7A", green: "#5FD3A0", blue: "#5BB8FF", yellow: "#FFE066", pink2: "#FF9AD5",
  cobble: "#8E7FA8", cobble2: "#A898C2", trunk: "#8A6A9E", water: "#BFE6FF", card: "#FFF7FB"
};
const FONT = '"Baloo 2","Trebuchet MS",system-ui,sans-serif';
const SYNC_MS = 130, KISSES_PER_HEART = 5, STAR_SYNC = 0.6, STARS_PER_GIFT = 2;
const SCALE = [0, 2, 3, 5, 7, 8, 11, 12, 14, 15, 17, 19, 20, 23, 24, 26];
const BTN = {};
let clock = 0;

/* ---------- Utilidades ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("botinhos." + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("botinhos." + k, JSON.stringify(v)); }catch(e){} }
};
const opts = Object.assign({ som: true, vib: true }, store.get("opcoes", {})); // som e vibração ligados por padrão
function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = i => { const s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); };
const lerp = (a, b, k) => a + (b - a) * Math.min(1, k);
function addRR(x, y, w, h, r){ r = Math.min(r, w / 2, h / 2); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function rr(x, y, w, h, r){ ctx.beginPath(); addRR(x, y, w, h, r); }
function heartPath(x, y, s){ ctx.beginPath(); ctx.moveTo(x, y + s * 0.9); ctx.bezierCurveTo(x - s * 1.25, y + s * 0.05, x - s * 0.6, y - s * 0.95, x, y - s * 0.3); ctx.bezierCurveTo(x + s * 0.6, y - s * 0.95, x + s * 1.25, y + s * 0.05, x, y + s * 0.9); ctx.closePath(); }
function starPath(x, y, s){ ctx.beginPath(); for(let k = 0; k < 10; k++){ const a = -Math.PI / 2 + k * Math.PI / 5, rr2 = k % 2 ? s * 0.45 : s; ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); } ctx.closePath(); }
function txt(s, x, y, size, fill, o = {}){
  ctx.save();
  ctx.font = `${o.w || 800} ${size}px ${FONT}`; ctx.textAlign = o.align || "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  if(o.stroke !== false){ ctx.lineWidth = size * (o.lw || 0.24); ctx.strokeStyle = o.stroke || C.ink; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
  ctx.restore();
}
const vibrate = ms => { if(!opts.vib) return; try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };


/* ---------- Tela: o jogo é sempre desenhado em paisagem ---------- */
let sw = 0, sh = 0, dpr = 1, W = 800, H = 400, LW = 400, rot = false;
let R, BX, OW, SP, V, G, FLAP, GROUND, phase = 0;
const params = p => ({ N: 14 + p, gap0: 0.44 - 0.006 * p, shrink: 0.07 + 0.003 * p, speed: 0.40 + 0.013 * p });
function layout(){
  const P = params(phase);
  R = H * 0.062; BX = LW * 0.24; OW = Math.max(38, LW * 0.13);
  SP = LW * 0.62; V = LW * P.speed; G = H * 2.1; FLAP = -H * 0.66; GROUND = H * 0.9;
}
function resize(){
  const r = cv.getBoundingClientRect();
  sw = r.width; sh = r.height; dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(sw * dpr); cv.height = Math.round(sh * dpr);
  rot = sh > sw;
  W = rot ? sh : sw; H = rot ? sw : sh; LW = W / 2;
  layout();
}
window.addEventListener("resize", resize);
resize();

/* ---------- Som (tudo sintetizado) ---------- */
let ac = null, master = null, noiseBuf = null;
function audioInit(){
  if(ac){ if(ac.state === "suspended") ac.resume(); return; }
  try{ ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = opts.som ? MASTER_GAIN : 0; master.connect(ac.destination); }catch(e){ ac = null; }
}
const MASTER_GAIN = 0.7;
function setOpt(k, on){
  opts[k] = on; store.set("opcoes", opts);
  if(k === "som" && master) master.gain.setValueAtTime(on ? MASTER_GAIN : 0, ac.currentTime);
  if(k === "vib" && on) vibrate(40);
}
function env(g, t, a, d, peak){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
function tone(f, t, dur, type, peak){ const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; env(g, t, 0.01, dur, peak); o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05); }
function noise(){
  if(!noiseBuf){ noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.6, ac.sampleRate); const d = noiseBuf.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = ac.createBufferSource(); s.buffer = noiseBuf; return s;
}
const SFX = {
  blup(i){ // bolha a cada toque; o caramelo é mais grave
    if(!ac) return; const t = ac.currentTime, f0 = i ? 330 : 440;
    const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine";
    o.frequency.setValueAtTime(f0 * 1.9, t); o.frequency.exponentialRampToValueAtTime(f0 * 0.85, t + 0.09);
    env(g, t, 0.005, 0.12, 0.45); o.connect(g).connect(master); o.start(t); o.stop(t + 0.16);
  },
  plim(i, n){ // nota de bandoneón que sobe a cada obstáculo; as duas linhas formam uma quinta
    if(!ac) return; const t = ac.currentTime;
    const f = (i ? 293.66 : 440) * Math.pow(2, SCALE[Math.max(0, Math.min(n - 1, SCALE.length - 1))] / 12);
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = f * 3.5;
    const g = ac.createGain(); env(g, t, 0.02, 0.26, 0.2); lp.connect(g).connect(master);
    [-7, 7].forEach(dt => { const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.detune.value = dt; o.connect(lp); o.start(t); o.stop(t + 0.33); });
  },
  tchibum(){
    if(!ac) return; const t = ac.currentTime;
    const n = noise(), bp = ac.createBiquadFilter(), g = ac.createGain();
    bp.type = "bandpass"; bp.Q.value = 1.2; bp.frequency.setValueAtTime(1800, t); bp.frequency.exponentialRampToValueAtTime(260, t + 0.35);
    env(g, t, 0.01, 0.4, 0.7); n.connect(bp).connect(g).connect(master); n.start(t); n.stop(t + 0.5);
    const o = ac.createOscillator(), g2 = ac.createGain(); o.type = "sine";
    o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.3);
    env(g2, t, 0.005, 0.3, 0.8); o.connect(g2).connect(master); o.start(t); o.stop(t + 0.35);
  },
  chord(){ if(!ac) return; const t = ac.currentTime; [1046.5, 1318.5, 1568].forEach((f, k) => tone(f, t + k * 0.025, 0.35, "triangle", 0.15)); },
  heartBack(){ if(!ac) return; const t = ac.currentTime + 0.15; [784, 988, 1175, 1568].forEach((f, k) => tone(f, t + k * 0.07, 0.25, "sine", 0.2)); },
  done(i){ if(!ac) return; const t = ac.currentTime, b = i ? 293.66 : 440; [0, 4, 7, 12].forEach((s, k) => tone(b * Math.pow(2, s / 12), t + k * 0.06, 0.3, "triangle", 0.18)); },
  win(){ if(!ac) return; const t = ac.currentTime; [440, 523.25, 659.25, 880, 659.25, 880, 1046.5].forEach((f, k) => tone(f, t + k * 0.11, 0.35, "triangle", 0.2)); tone(220, t, 1.2, "sine", 0.2); },
  over(){ if(!ac) return; const t = ac.currentTime; [523.25, 440, 349.23, 261.63].forEach((f, k) => tone(f, t + k * 0.16, 0.3, "triangle", 0.18)); },
  gift(){ if(!ac) return; const t = ac.currentTime; [1046.5, 1318.5, 1568, 2093].forEach((f, k) => tone(f, t + k * 0.08, 0.4, "triangle", 0.16)); },
  count(go){ if(!ac) return; const t = ac.currentTime; if(go){ tone(880, t, 0.3, "triangle", 0.2); tone(1318.5, t + 0.04, 0.3, "triangle", 0.14); } else tone(587.33, t, 0.12, "triangle", 0.18); },
  pause(){ if(!ac) return; const t = ac.currentTime; tone(784, t, 0.1, "sine", 0.15); tone(523.25, t + 0.07, 0.14, "sine", 0.15); },
  tango(){ // melodia original em ritmo de habanera, com timbre de caixinha de música
    if(!ac) return; const t0 = ac.currentTime + 0.05, b = 0.26, n = s => 440 * Math.pow(2, s / 12);
    const box = (f, t, d, peak) => { tone(f, t, Math.max(0.25, d * 1.6), "sine", peak); tone(f * 2.01, t, 0.15, "sine", peak * 0.35); };
    const mel = [[0, 1.5], [7, 0.5], [5, 1], [3, 1], [2, 1.5], [3, 0.5], [2, 1], [-1, 1], [0, 1.5], [7, 0.5], [8, 1], [7, 1], [5, 1], [3, 1], [2, 1], [0, 1]];
    let t = t0; mel.forEach(([s, d]) => { box(n(s + 12), t, d * b, 0.16); t += d * b; });
    [-12, -17, -12, -19].forEach((root, k) => { const bt = t0 + k * 4 * b; box(n(root - 12), bt, b * 1.4, 0.12); box(n(root - 5), bt + 2 * b, b * 1.2, 0.08); });
  }
};


/* ---------- Timbres do "plim" de cada fase ---------- */
function osc(type, f, t, dur, peak, dest){ const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); env(g, t, 0.01, dur, peak); o.connect(g).connect(dest || master); o.start(t); o.stop(t + dur + 0.05); return o; }
function vibrato(o, t, dur, rate, depth){ const l = ac.createOscillator(), g = ac.createGain(); l.frequency.value = rate; g.gain.value = depth; l.connect(g).connect(o.frequency); l.start(t); l.stop(t + dur + 0.05); }
function click(t, freq, q, peak){ const n = noise(), bp = ac.createBiquadFilter(), g = ac.createGain(); bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = q; env(g, t, 0.003, 0.05, peak); n.connect(bp).connect(g).connect(master); n.start(t); n.stop(t + 0.08); }
const TIMBRE = {
  berimbau(f, t){ const o = osc("triangle", f * 0.5, t, 0.4, 0.28); o.frequency.linearRampToValueAtTime(f * 0.535, t + 0.09); osc("sine", f, t, 0.25, 0.08); click(t, 6000, 1.5, 0.12); },
  matraca(f, t){ click(t, 2600, 4, 0.4); click(t + 0.07, 2200, 4, 0.34); osc("sine", f * 2, t, 0.08, 0.12); },
  assobio(f, t){ const o = osc("sine", f * 1.6, t, 0.38, 0.18); o.frequency.exponentialRampToValueAtTime(f * 2.1, t + 0.18); vibrato(o, t, 0.38, 7, f * 0.03); },
  metro(f, t){ osc("sine", f * 1.5, t, 0.3, 0.2); osc("sine", f * 3, t, 0.12, 0.05); osc("sine", f * 1.19, t + 0.14, 0.4, 0.2); },
  trompete(f, t){ const bp = ac.createBiquadFilter(), g = ac.createGain(); bp.type = "bandpass"; bp.frequency.value = f * 2.2; bp.Q.value = 1.2; g.gain.value = 1.6; bp.connect(g).connect(master); const o = osc("sawtooth", f, t, 0.24, 0.22, bp); vibrato(o, t, 0.24, 6, f * 0.012); },
  bandoneon(f, t){ const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = f * 3.5; lp.connect(master); [-7, 7].forEach(dt => { const o = osc("sawtooth", f, t, 0.28, 0.12, lp); o.detune.value = dt; }); },
  cuica(f, t){ const o = osc("triangle", f * 0.8, t, 0.32, 0.3); o.frequency.exponentialRampToValueAtTime(f * 1.7, t + 0.1); o.frequency.exponentialRampToValueAtTime(f * 1.05, t + 0.26); },
  agogo(f, t){ osc("sine", f * 2, t, 0.18, 0.18); osc("sine", f * 5.52, t, 0.08, 0.06); osc("sine", f * 1.5, t + 0.12, 0.2, 0.16); osc("sine", f * 4.14, t + 0.12, 0.07, 0.05); },
  synth(f, t){ const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.setValueAtTime(4500, t); lp.frequency.exponentialRampToValueAtTime(500, t + 0.25); lp.Q.value = 6; lp.connect(master); osc("square", f, t, 0.26, 0.12, lp); osc("square", f * 2.003, t, 0.2, 0.05, lp); },
  harpa(f, t){ osc("triangle", f, t, 0.6, 0.22); osc("sine", f * 2, t, 0.3, 0.06); osc("triangle", f * 1.5, t + 0.07, 0.5, 0.14); }
};
SFX.plim = (i, n) => {
  if(!ac) return;
  const f = (i ? 293.66 : 440) * Math.pow(2, SCALE[(n - 1 + SCALE.length) % SCALE.length] / 12);
  TIMBRE[PHASES[phase].timbre](f, ac.currentTime);
};

/* ---------- Áudios gravados: "Gurl" quando os corações acabam, "Yay" nas 3 estrelas ---------- */
// Os arquivos já vêm cortados e com o mesmo volume (-16 LUFS); este ganho os deixa um pouco acima dos sons sintetizados.
const CLIPS = { gurl: null, yay: null }, CLIP_GAIN = 0.56;
let clipsAsked = false;
function loadClips(){
  if(clipsAsked || !ac) return;
  clipsAsked = true;
  Object.keys(CLIPS).forEach(name => {
    fetch("./sons/" + name + ".mp3")
      .then(r => { if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(b => new Promise((ok, no) => ac.decodeAudioData(b, ok, no)))
      .then(buf => { CLIPS[name] = buf; })
      .catch(() => { clipsAsked = false; });
  });
}
function playClip(name, delay){
  if(!ac || !CLIPS[name]) return false;
  const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = CLIPS[name]; g.gain.value = CLIP_GAIN; s.connect(g).connect(master); s.start(ac.currentTime + (delay || 0));
  return true;
}

/* ---------- Coleção ---------- */
// Linha do tempo: os presentes saem nesta ordem, um por partida, em qualquer fase
const ITEMS = [
  { id: "lhama", nome: "Chaveirinho de lhama" },
  { id: "perfumes", nome: "Maletinha de perfumes" },
  { id: "fernet", nome: "Fernet com coca" },
  { id: "polaroids", nome: "Polaroids dos botinhos" },
  { id: "caixinha", nome: "Caixinha de música de tango" },
  { id: "buque1", nome: "Primeiro buquê" },
  { id: "garrafa", nome: "Garrafinha térmica" },
  { id: "shorts", nome: "Shortinho de praia" },
  { id: "chocolates", nome: "Chocolates com recado" },
  { id: "oculos", nome: "Óculos de lentes vermelhas" },
  { id: "meias", nome: "Meias de arco-íris" },
  { id: "ingressos", nome: "Ingressos do Xou da Xuxa" },
  { id: "buque2", nome: "Segundo buquê" },
  { id: "paes", nome: "Bandeja de pães" },
  { id: "unicornio", nome: "Fantasia de unicórnio" }
];
function circ(x, y, r){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function ell(x, y, rx, ry, a){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, a || 0, 0, Math.PI * 2); }
function poly(pts){ ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); }
function fs(fill, lw){ ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw || 3; ctx.strokeStyle = C.ink; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.stroke(); }
function bow(x, y, s, col){ ell(x - s * 0.9, y, s, s * 0.6, -0.35); fs(col, 2.2); ell(x + s * 0.9, y, s, s * 0.6, 0.35); fs(col, 2.2); circ(x, y, s * 0.35); fs(col, 2.2); }
function musicNote(x, y, s){ circ(x, y, s); ctx.fillStyle = C.ink; ctx.fill(); ctx.fillRect(x + s - 1.4, y - s * 3.2, 1.8, s * 3.2); ctx.fillRect(x + s - 1.4, y - s * 3.2, s * 1.8, 1.8); }
function sparkle(x, y, s, col){ starPath(x, y, s); ctx.fillStyle = col; ctx.fill(); }
function flower(x, y, r, col){ for(let k = 0; k < 5; k++){ const a = k * Math.PI * 2 / 5; circ(x + Math.cos(a) * r, y + Math.sin(a) * r, r * 0.75); ctx.fillStyle = col; ctx.fill(); } circ(x, y, r * 0.6); ctx.fillStyle = C.yellow; ctx.fill(); }
function cone(paper){ poly([[-30, -4], [30, -4], [3, 48], [-3, 48]]); fs(paper); ctx.strokeStyle = "rgba(46,31,71,0.3)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-14, -4); ctx.lineTo(-1, 46); ctx.moveTo(14, -4); ctx.lineTo(1, 46); ctx.stroke(); }
function leaves(){ [[-27, -6, -0.8], [27, -6, 0.8], [-20, -30, -0.4], [21, -31, 0.5]].forEach(([x, y, a]) => { ell(x, y, 11, 4.5, a); fs(C.green, 2); }); }
function marigold(x, y, r){
  const pts = Array.from({ length: 12 }, (_, k) => [x + Math.cos(k * Math.PI / 6) * r * 0.85, y + Math.sin(k * Math.PI / 6) * r * 0.85]);
  pts.forEach(([px, py]) => { circ(px, py, r * 0.38); ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke(); });
  pts.forEach(([px, py]) => { circ(px, py, r * 0.38); ctx.fillStyle = "#FFA41B"; ctx.fill(); });
  circ(x, y, r * 0.62); ctx.fillStyle = "#FF7A00"; ctx.fill(); circ(x, y, r * 0.26); ctx.fillStyle = "#C94F00"; ctx.fill();
}
function rose(x, y, r, col, dark){
  circ(x, y, r); fs(col, 2);
  ctx.strokeStyle = dark; ctx.lineWidth = 1.6; ctx.beginPath();
  for(let a = 0; a < Math.PI * 5; a += 0.2){ const rr2 = r * 0.75 * (1 - a / (Math.PI * 5.5)); ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
  ctx.stroke();
}
function petalsRing(x, y, n, len, wid, dist, col, off, lw){
  for(let k = 0; k < n; k++){
    const a = off + k * Math.PI * 2 / n;
    ctx.save(); ctx.translate(x + Math.cos(a) * dist, y + Math.sin(a) * dist); ctx.rotate(a);
    ell(0, 0, len, wid); ctx.fillStyle = col; ctx.fill();
    if(lw){ ctx.lineWidth = lw; ctx.strokeStyle = C.ink; ctx.stroke(); }
    ctx.restore();
  }
}
function daisy(x, y, r, petal, center){ petalsRing(x, y, 12, r * 0.5, r * 0.2, r * 0.55, petal, 0, 1); circ(x, y, r * 0.32); fs(center, 1.2); }
function gerbera(x, y, r){ petalsRing(x, y, 22, r * 0.5, r * 0.13, r * 0.58, "#E8202F", 0, 0.8); petalsRing(x, y, 16, r * 0.34, r * 0.12, r * 0.36, "#C8101F", 0.2, 0); circ(x, y, r * 0.26); fs("#6E0A14", 1.2); }
function chrys(x, y, r, col, tip){ for(let ring = 3; ring >= 1; ring--) petalsRing(x, y, ring * 7, r * 0.22, r * 0.1, r * ring / 3 * 0.8, ring === 3 ? tip : col, ring, 0); circ(x, y, r * 0.17); ctx.fillStyle = "#F2D04B"; ctx.fill(); }
function alstro(x, y, r, col, streak){
  for(let k = 0; k < 6; k++){
    const a = k * Math.PI / 3 - Math.PI / 2;

const SIL = {};
function silhouette(k, size){
  const key = k + ":" + Math.round(size) + ":" + dpr;
  if(!SIL[key]){
    const px = Math.ceil(size * 2 * dpr), off = document.createElement("canvas"), main = ctx;
    off.width = off.height = px; ctx = off.getContext("2d");
    try{
      ctx.setTransform(dpr * size / 100, 0, 0, dpr * size / 100, px / 2, px / 2); DRAW[ITEMS[k].id]();
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = "source-in"; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, px, px);
    }finally{ ctx = main; }
    SIL[key] = off;
  }
  return SIL[key];
}

  }

function drawBoto(x, y, r, col, belly, face, tilt, sq, t, alpha){
  ctx.save(); ctx.globalAlpha = alpha;

    () => { ctx.save(); ctx.translate(-r * 1.95, 0); ctx.rotate(wig); ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-r * 0.3, -r * 0.55, -r * 0.65, -r * 0.5); ctx.quadraticCurveTo(-r * 0.35, -r * 0.1, 0, 0); ctx.quadraticCurveTo(-r * 0.35, r * 0.1, -r * 0.65, r * 0.5); ctx.quadraticCurveTo(-r * 0.3, r * 0.55, 0, 0); ctx.restore(); },
    () => { ctx.beginPath(); ctx.ellipse(-r * 0.25, -r * 0.8, r * 0.32, r * 0.18, -0.2, 0, Math.PI * 2); },
    () => { ctx.beginPath(); ctx.ellipse(0, 0, r * 1.25, r * 0.85, 0, 0, Math.PI * 2); },
    () => { ctx.beginPath(); ctx.ellipse(r * 0.7, -r * 0.2, r * 0.68, r * 0.62, 0, 0, Math.PI * 2); },
    () => { ctx.beginPath(); addRR(r * 1.05, -r * 0.04, r * 1.0, r * 0.32, r * 0.16); }
  ];
  ctx.lineJoin = "round"; ctx.lineWidth = r * 0.3; ctx.strokeStyle = C.ink;
  shapes.forEach(s => { s(); ctx.stroke(); });
  ctx.fillStyle = col; shapes.forEach(s => { s(); ctx.fill(); });
  ctx.save(); shapes[3](); ctx.clip(); ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(r * 0.15, r * 0.7, r * 1.3, r * 0.55, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.fillStyle = "rgba(255,255,255,0.45)"; ctx.beginPath(); ctx.ellipse(r * 0.55, -r * 0.62, r * 0.28, r * 0.12, -0.3, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = belly; ctx.fill(); ctx.lineWidth = r * 0.14; ctx.stroke();

  ctx.lineWidth = r * 0.09; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(r * 1.1, r * 0.17); ctx.quadraticCurveTo(r * 1.35, r * 0.27, r * 1.6, r * 0.18); ctx.stroke();
  const blink = (t * 0.33 + face * 0.17) % 1 > 0.96;
  if(blink){ ctx.lineWidth = r * 0.1; ctx.beginPath(); ctx.moveTo(r * 0.62, -r * 0.3); ctx.quadraticCurveTo(r * 0.86, -r * 0.18, r * 1.1, -r * 0.3); ctx.stroke(); }
  else{
    ctx.fillStyle = "#FFFFFF"; ctx.beginPath(); ctx.arc(r * 0.86, -r * 0.32, r * 0.27, 0, Math.PI * 2); ctx.fill(); ctx.lineWidth = r * 0.1; ctx.stroke();

    ctx.fillStyle = "#FFFFFF"; ctx.beginPath(); ctx.arc(r * 0.98, -r * 0.38, r * 0.06, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

/* ---------- Peças de cenário (coordenadas da faixa: 0 = borda externa, LW = centro) ---------- */
function farLoop(scroll, par, span, fn){ const s = scroll * par, base = Math.floor(s / span), off = s - base * span; for(let k = -1; k < LW / span + 2; k++) fn(k * span - off, base + k); }
function skyFill(a, b){ const g = ctx.createLinearGradient(0, 0, 0, GROUND); g.addColorStop(0, a); g.addColorStop(1, b); ctx.fillStyle = g; ctx.fillRect(0, 0, LW + 2, H); }
function sun(x, y, r, col, glow){ if(glow){ ctx.fillStyle = glow; circ(x, y, r * 1.6); ctx.fill(); } ctx.fillStyle = col; circ(x, y, r); ctx.fill(); }
function puff(x, y, s, col){ ctx.fillStyle = col; [[0, 0, 1], [1.1, 0.22, 0.8], [-1.1, 0.25, 0.75], [0.4, -0.45, 0.7]].forEach(([dx, dy, k]) => { circ(x + dx * s, y + dy * s, s * k); ctx.fill(); }); }
function clouds(scroll, col){ farLoop(scroll, 0.12, 280, (x, i) => puff(x + 90, H * (0.12 + hash(i) * 0.12), H * 0.045, col)); }
function waterBand(y0, col, line, scroll){
  ctx.fillStyle = col; ctx.fillRect(0, y0, LW + 2, GROUND - y0);
  ctx.strokeStyle = line; ctx.lineWidth = 2; ctx.lineCap = "round";
  const off = (scroll * 0.4) % 40;
  for(let y = y0 + 8, r = 0; y < GROUND; y += 12, r++) for(let x = -off - 40 + (r % 2) * 20; x < LW + 40; x += 40){ ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 6, y - 3, x + 12, y); ctx.stroke(); }
}
function groundLine(){ ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(LW + 2, GROUND); ctx.stroke(); }
function stones(scroll, base, stone){
  ctx.fillStyle = base; ctx.fillRect(0, GROUND, LW + 2, H - GROUND);
  const step = 30, off = scroll % step; ctx.fillStyle = stone;
  for(let row = 0; row < 3; row++){ const y = GROUND + 7 + row * 14; if(y > H) break; for(let x = -off - step + (row % 2) * 15; x < LW + step; x += step){ rr(x + 2, y, step - 6, 10, 5); ctx.fill(); } }
  groundLine();
}
function waterGround(scroll, base, line){
  ctx.fillStyle = base; ctx.fillRect(0, GROUND, LW + 2, H - GROUND);
  ctx.strokeStyle = line; ctx.lineWidth = 2.5; ctx.lineCap = "round";
  const off = scroll % 36;
  for(let row = 0; row < 3; row++){ const y = GROUND + 8 + row * 12; for(let x = -off - 36 + (row % 2) * 18; x < LW + 36; x += 36){ ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 8, y - 4, x + 16, y); ctx.stroke(); } }
  groundLine();
}
function predio(x, w, b, col, lit, dark, seed){
  rr(x, b, w, GROUND - b + 4, 3); fs(col);
  for(let y = b + 10, r = 0; y < GROUND - 14; y += 15, r++) for(let c = 0; c < 3; c++){ ctx.fillStyle = hash(seed * 31 + r * 3 + c) > 0.55 ? lit : dark; ctx.fillRect(x + 6 + c * (w - 12) / 3, y, (w - 12) / 3 - 5, 8); }
}
function tree(x, h, idx){
  ctx.fillStyle = C.trunk; rr(x - 5, GROUND - h, 10, h, 5); ctx.fill();
  const y = GROUND - h, s = H * (0.065 + hash(idx + 9) * 0.02);
  ctx.fillStyle = C.jac;
  [[0, 0, 1.15], [-1.0, 0.45, 0.9], [1.0, 0.5, 0.95], [-0.4, -0.6, 0.8], [0.5, -0.5, 0.8]].forEach(([dx, dy, k]) => { circ(x + dx * s, y + dy * s, s * k); ctx.fill(); });
  ctx.fillStyle = C.jac2;
  [[-0.5, -0.3], [0.6, 0.1], [-0.1, 0.4], [0.2, -0.7]].forEach(([dx, dy]) => { circ(x + dx * s, y + dy * s, s * 0.22); ctx.fill(); });
}
function boi(x, y, s){ // boi do bumba-meu-boi, de longe
  ctx.fillStyle = "#FF5DA2"; poly([[x - s * 0.7, y], [x + s * 0.7, y], [x + s * 0.8, y + s * 0.7], [x - s * 0.8, y + s * 0.7]]); ctx.fill();
  ["#FFD23F", "#2EC4B6", "#9B5DE5"].forEach((c, k) => { ctx.fillStyle = c; ctx.fillRect(x - s * 0.72 + k * 2, y + s * (0.18 + k * 0.17), s * 1.44 - k * 4, s * 0.08); });
  ctx.fillStyle = C.ink; ell(x, y, s * 0.7, s * 0.35); ctx.fill();
  ctx.fillStyle = C.ouro; for(let k = 0; k < 6; k++){ circ(x - s * 0.45 + k * s * 0.18, y - s * 0.05 + (k % 2) * 4, 1.6); ctx.fill(); }
  ctx.fillStyle = C.ink; circ(x + s * 0.75, y - s * 0.25, s * 0.22); ctx.fill();
  ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.beginPath();
  ctx.moveTo(x + s * 0.7, y - s * 0.42); ctx.quadraticCurveTo(x + s * 0.6, y - s * 0.65, x + s * 0.5, y - s * 0.6);
  ctx.moveTo(x + s * 0.85, y - s * 0.42); ctx.quadraticCurveTo(x + s * 0.95, y - s * 0.65, x + s * 1.05, y - s * 0.6); ctx.stroke();
  sparkle(x + s * 0.75, y - s * 0.25, 4, "#FFFFFF");
}
function quati(x, y, w){ // y = borda de cima do quati
  const s = w * 0.5;
  ctx.save(); ctx.translate(x, y + s * 0.95); ctx.lineCap = "round";
  ctx.lineWidth = s * 0.28 + 5; ctx.strokeStyle = C.ink; ctx.beginPath(); ctx.moveTo(-s * 0.5, 0); ctx.quadraticCurveTo(-s * 1.0, -s * 0.4, -s * 0.75, -s * 0.8); ctx.stroke();
  ctx.lineWidth = s * 0.28; ctx.strokeStyle = "#8B5E3C"; ctx.stroke();
  ctx.setLineDash([s * 0.12, s * 0.12]); ctx.strokeStyle = "#4A2F1D"; ctx.stroke(); ctx.setLineDash([]);
  ell(0, -s * 0.15, s * 0.62, s * 0.4); fs("#A87650");
  ell(s * 0.45, -s * 0.55, s * 0.32, s * 0.26); fs("#A87650");
  poly([[s * 0.65, -s * 0.62], [s * 1.05, -s * 0.52], [s * 0.68, -s * 0.42]]); fs("#A87650", 2);
  circ(s * 1.05, -s * 0.52, s * 0.06); ctx.fillStyle = C.ink; ctx.fill();
  ell(s * 0.3, -s * 0.78, s * 0.09, s * 0.12); fs("#A87650", 2);
  ctx.fillStyle = "#F3E3C3"; ell(s * 0.55, -s * 0.5, s * 0.12, s * 0.06); ctx.fill();
  circ(s * 0.5, -s * 0.6, s * 0.05); ctx.fillStyle = C.ink; ctx.fill();
  ctx.restore();
}

function ambNew(kind, init){
  const p = { x: Math.random() * W, y: init ? Math.random() * GROUND : -10, ph: Math.random() * 6.28, life: 0, vx: 0, vy: 0, s: 3, max: 3 };
  if(kind === "petals" || kind === "petalsOrange"){ p.vy = 18 + Math.random() * 28; p.s = 2.5 + Math.random() * 2.5; }
  else if(kind === "rain"){ p.vy = H * 1.4; p.vx = -H * 0.3; p.x = Math.random() * (W + 120); }
  else if(kind === "drizzle"){ p.vy = H * 0.7; p.vx = -H * 0.05; }
  else if(kind === "sand"){ if(!init) p.x = -5; p.y = GROUND - Math.random() * H * 0.5; p.vx = 90 + Math.random() * 120; p.vy = (Math.random() - 0.5) * 20; }
  else if(kind === "birds"){ if(!init) p.x = -20; p.y = H * (0.1 + Math.random() * 0.25); p.vx = 25 + Math.random() * 25; }
  else if(kind === "fireflies" || kind === "neon"){ p.y = Math.random() * GROUND; p.max = 2 + Math.random() * 3; }
  else if(kind === "mist"){ p.y = init ? Math.random() * H : H + 30; p.vy = -10 - Math.random() * 12; p.s = 20 + Math.random() * 30; }
  return p;
}
function ambInit(){ const kind = PHASES[phase].amb; amb = Array.from({ length: AMB_COUNT[kind] || 0 }, () => ambNew(kind, true)); }
function ambUpdate(dt){
  const kind = PHASES[phase].amb;
  amb.forEach((p, k) => {
    p.life += dt;
    if(kind === "petals" || kind === "petalsOrange"){ p.y += p.vy * dt; p.x += Math.sin(clock * 1.5 + p.ph) * 12 * dt; if(p.y > GROUND) amb[k] = ambNew(kind, false); }
    else if(kind === "rain" || kind === "drizzle"){ p.y += p.vy * dt; p.x += p.vx * dt; if(p.y > GROUND) amb[k] = ambNew(kind, false); }
    else if(kind === "sand" || kind === "birds"){ p.x += p.vx * dt; p.y += p.vy * dt; if(p.x > W + 30) amb[k] = ambNew(kind, false); }
    else if(kind === "fireflies" || kind === "neon"){ p.x += Math.sin(clock + p.ph) * 8 * dt; p.y += Math.cos(clock * 0.7 + p.ph) * 6 * dt; if(p.life > p.max) amb[k] = ambNew(kind, false); }
    else if(kind === "mist"){ p.y += p.vy * dt; p.x += Math.sin(clock * 0.5 + p.ph) * 6 * dt; if(p.y < -p.s) amb[k] = ambNew(kind, false); }
  });
}
function ambDraw(){
  const kind = PHASES[phase].amb;
  ctx.save();
  amb.forEach(p => {
    if(kind === "petals" || kind === "petalsOrange"){ ctx.fillStyle = kind === "petals" ? C.jac2 : "#FFA41B"; ell(p.x, p.y, p.s * 1.4, p.s, Math.sin(clock * 2 + p.ph)); ctx.fill(); }
    else if(kind === "rain"){ ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 4, p.y + 14); ctx.stroke(); }
    else if(kind === "drizzle"){ ctx.strokeStyle = "rgba(255,255,255,0.45)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 1, p.y + 7); ctx.stroke(); }
    else if(kind === "sand"){ ctx.fillStyle = "rgba(222,199,151,0.9)"; circ(p.x, p.y, 1.6); ctx.fill(); }
    else if(kind === "birds"){ const f = Math.sin(clock * 8 + p.ph) * 4; ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(p.x - 7, p.y - f); ctx.quadraticCurveTo(p.x - 3, p.y - 2, p.x, p.y); ctx.quadraticCurveTo(p.x + 3, p.y - 2, p.x + 7, p.y - f); ctx.stroke(); }
    else if(kind === "fireflies"){ const a = Math.max(0, Math.sin(p.life / p.max * Math.PI)); ctx.fillStyle = `rgba(255,236,140,${0.25 * a})`; circ(p.x, p.y, 7); ctx.fill(); ctx.fillStyle = `rgba(255,246,190,${a})`; circ(p.x, p.y, 2); ctx.fill(); }
    else if(kind === "neon"){ ctx.globalAlpha = Math.max(0, Math.sin(p.life / p.max * Math.PI)); sparkle(p.x, p.y, 4, p.ph > 3.14 ? "#FF4FD8" : "#38E1FF"); ctx.globalAlpha = 1; }
    else if(kind === "mist"){ ctx.fillStyle = "rgba(255,255,255,0.18)"; circ(p.x, p.y, p.s); ctx.fill(); }
  });
  ctx.restore();
}

/* ---------- Estado e progresso ---------- */
let state = "title", stateT = 0, shake = 0, meetBurst = false;
let gaps = [], lanes = [], hearts = 3, kisses = 0, syncs = 0, taps = [0, 0], crashes = 0, tPlay = 0, lastTap = [-1, -1];
let parts = [], result = null, detail = -1, giftQueue = [], giftT = 0, giftOpened = false, yayPlayed = false;
let countN = 0, confirmReset = false, confirmAt = 0, replayOpened = false;
const COUNT_STEP = 0.55; // contagem 3, 2, 1 antes de nadar
let N = 14, GAP0 = 0.44, SHRINK = 0.07, STAR_TIME = 30;
let collected = store.get("linha", []);
let prog = store.get("progresso", null);
if(!prog || !Array.isArray(prog.stars) || prog.stars.length !== PHASES.length) prog = { stars: PHASES.map(() => 0), best: PHASES.map(() => null), unlocked: 1 };
const nextPhase = () => Math.min(prog.unlocked, PHASES.length) - 1;

function newLane(i){ return { i, x: BX, y: H * 0.45, vy: 0, passed: 0, spawned: 0, obs: [], dist: SP * 0.35, done: false, inv: 0, sq: 0, tilt: 0, scroll: i * 137 }; }
function reset(){
  const rng = mulberry32((Math.random() * 2 ** 31) | 0);
  gaps = Array.from({ length: N }, () => 0.28 + rng() * 0.34);
  lanes = [newLane(0), newLane(1)];
  hearts = 3; kisses = 0; syncs = 0; taps = [0, 0]; crashes = 0; tPlay = 0; lastTap = [-1, -1]; parts = []; result = null;
  giftQueue = []; giftT = 0; giftOpened = false; yayPlayed = false;
}
function startPhase(p){
  phase = Math.max(0, Math.min(PHASES.length - 1, p));
  const P = params(phase); N = P.N; GAP0 = P.gap0; SHRINK = P.shrink;
  layout(); STAR_TIME = Math.round((N * SP + LW) / V * 1.25);
  ambInit(); reset();
}
function setState(s){ state = s; stateT = 0; if(s === "meet") meetBurst = false; if(s === "count") countN = 0; if(s === "replay") replayOpened = false; if(s === "opcoes") confirmReset = false; }
function resetJourney(){ // apaga fases, estrelas e álbum; volta para Salvador
  prog = { stars: PHASES.map(() => 0), best: PHASES.map(() => null), unlocked: 1 };
  collected = [];
  store.set("progresso", prog); store.set("linha", collected);
  startPhase(0);
}
const gapH = k => H * (GAP0 - SHRINK * Math.min(1, k / N));
const sx = (L, lx) => L.i === 0 ? lx : W - lx;

/* ---------- Partículas do jogo ---------- */
function addP(p){ parts.push(Object.assign({ life: 0, max: 0.8, vx: 0, vy: 0, g: 0, s: 6 }, p)); }
function splash(L){ const x = sx(L, L.x); for(let k = 0; k < 14; k++) addP({ type: "drop", x, y: L.y, vx: (Math.random() - 0.5) * H * 0.9, vy: -Math.random() * H * 0.8, g: H * 1.8, s: 3 + Math.random() * 4, max: 0.7 }); }
function bubbles(L){ const f = L.i === 0 ? 1 : -1, x = sx(L, L.x) - f * R * 1.9; for(let k = 0; k < 3; k++) addP({ type: "bubble", x: x + (Math.random() - 0.5) * 8, y: L.y + (Math.random() - 0.5) * 10, vx: -f * 20, vy: -30 - Math.random() * 40, s: 2 + Math.random() * 3, max: 0.6 }); }
function sparks(L){ const x = sx(L, L.x); for(let k = 0; k < 4; k++) addP({ type: "spark", x, y: L.y - R, vx: (Math.random() - 0.5) * 120, vy: -60 - Math.random() * 80, s: 5, max: 0.5 }); }
function kissFx(){ lanes.forEach(L => addP({ type: "heart", x: sx(L, L.x), y: L.y - R, vx: (W / 2 - sx(L, L.x)) * 0.6, vy: -H * 0.25, s: 9, max: 0.9 })); }
function heartBurst(){ for(let k = 0; k < 26; k++){ const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 220; addP({ type: "heart", x: W / 2, y: H * 0.5, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, g: 120, s: 7 + Math.random() * 8, max: 1.6 }); } }
function floatText(s, x, y, color){ addP({ type: "text", txt: s, x, y, vy: -40, s: H * 0.06, color, max: 1.2 }); }

/* ---------- Regras ---------- */
function crash(L){
  hearts--; crashes++; shake = 0.3;
  L.passed = Math.max(0, L.passed - 1);
  L.inv = 1.6; L.vy = FLAP * 0.75; L.y = Math.min(L.y, GROUND - R); L.sq = 1;
  splash(L); SFX.tchibum(); vibrate(60);
  if(hearts <= 0){ setState("over"); if(!playClip("gurl", 0.25)) SFX.over(); }
}
function updateLane(L, dt){
  L.scroll += V * dt;
  L.sq = Math.max(0, L.sq - dt * 5);
  if(L.inv > 0) L.inv -= dt;
  for(const o of L.obs){
    o.x -= V * dt;
    if(!o.counted && o.x + OW < L.x - R){ o.counted = true; L.passed++; SFX.plim(L.i, L.passed); sparks(L); }
  }
  L.obs = L.obs.filter(o => o.x > -OW - 20);
  if(L.done){
    L.x = lerp(L.x, LW - R * 2.6, dt * 2.5);
    L.y = lerp(L.y, H * 0.45 + Math.sin(clock * 3 + L.i) * H * 0.03, dt * 3);
    L.vy = 0; L.tilt *= 0.9; return;
  }
  const ahead = L.obs.reduce((n, o) => n + (o.counted ? 0 : 1), 0);
  L.dist += V * dt;
  if(L.dist >= SP && L.passed + ahead < N){
    L.dist = 0; const k = L.spawned++;
    L.obs.push({ x: LW + 4, c: gaps[k % N], h: gapH(L.passed + ahead), counted: false, seed: k + L.i * 2 });
  }
  L.vy = Math.min(L.vy + G * dt, H * 1.3); L.y += L.vy * dt;
  L.tilt = Math.max(-0.5, Math.min(1.1, L.vy / (H * 1.1)));
  if(L.y < R){ L.y = R; L.vy = 0; }
  if(L.y + R * 0.8 > GROUND){
    if(L.inv > 0){ L.y = GROUND - R * 0.8; L.vy = FLAP * 0.7; } else { crash(L); return; }
  }
  if(L.inv <= 0){
    for(const o of L.obs){
      if(L.x + R * 0.9 > o.x && L.x - R * 0.9 < o.x + OW){
        const top = o.c * H - o.h / 2, bot = o.c * H + o.h / 2;
        if(L.y - R * 0.7 < top || L.y + R * 0.7 > bot){ crash(L); return; }
      }
    }
  }
  if(L.passed >= N){ L.done = true; SFX.done(L.i); }
}
function finish(){
  const syncRate = (taps[0] + taps[1]) ? syncs * 2 / (taps[0] + taps[1]) : 0;
  const stars = [crashes === 0, syncRate >= STAR_SYNC, tPlay <= STAR_TIME];
  const n = stars.filter(Boolean).length;
  const prev = prog.best[phase];
  result = { stars, n, time: tPlay, crashes, syncRate, record: !prev || n > prev.n || (n === prev.n && tPlay < prev.time) };
  if(result.record) prog.best[phase] = { n, time: tPlay };
  prog.stars[phase] = Math.max(prog.stars[phase], n);
  prog.unlocked = Math.min(PHASES.length, Math.max(prog.unlocked, phase + 2));
  store.set("progresso", prog);
  // A cada 2 estrelas no total (contando só a melhor marca de cada fase), o próximo presente da linha do tempo
  const total = prog.stars.reduce((a, b) => a + b, 0), target = Math.min(ITEMS.length, Math.floor(total / STARS_PER_GIFT));
  giftQueue = [];
  for(let k = 0; k < ITEMS.length && collected.length < target; k++) if(!collected.includes(ITEMS[k].id)){ collected.push(ITEMS[k].id); giftQueue.push(k); }
  if(giftQueue.length) store.set("linha", collected);
  result.total = total; giftT = 0; giftOpened = false; yayPlayed = false;
}
function flap(i){ const L = lanes[i]; L.vy = FLAP; L.sq = 1; SFX.blup(i); bubbles(L); }
const GIFT_AT = 1.7; // segundos na tela de vitória antes de o presente aparecer
const showingGift = () => state === "win" && giftQueue.length > 0 && stateT > GIFT_AT;

/* ---------- Tela cheia, orientação e tela acesa ---------- */
function lockLandscape(){ try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape-primary").catch(() => {}); }catch(e){} }
function goFull(){
  const el = document.documentElement;
  const standalone = window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches;
  if(!standalone && !document.fullscreenElement && el.requestFullscreen){ el.requestFullscreen({ navigationUI: "hide" }).then(lockLandscape).catch(() => {}); }
  else lockLandscape();
}
let wakeLock = null;
async function wake(){ try{ if(!wakeLock && navigator.wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } }catch(e){} }
// Sair do app (ligação, notificação, trocar de app) pausa a fase
document.addEventListener("visibilitychange", () => { if(document.hidden) pauseGame(true); });

/* ---------- Pausa ---------- */
const playing = () => state === "play" || state === "count";
function pauseGame(quiet){ if(!playing()) return; setState("pause"); lastTap = [-1, -1]; shake = 0; if(!quiet) SFX.pause(); }
function resume(){ lanes.forEach(L => { if(!L.done) L.vy = Math.min(L.vy, 0); }); setState("count"); wake(); }

/* ---------- Botão voltar do Android ---------- */
// Uma entrada extra no histórico segura o "voltar": em vez de fechar o app, ele pausa ou volta uma tela.
let backArmed = false;
function armBack(){ if(backArmed) return; try{ history.pushState({ botinhos: 1 }, ""); backArmed = true; }catch(e){} }
function goBack(){
  if(playing()) pauseGame();
  else if(state === "pause") resume();
  else if(state === "intro" || state === "over") setState("map");
  else if(state === "map" || state === "album") setState("title");
  else if(state === "item") setState("album");
  else if(state === "replay") setState("item");
  else if(state === "opcoes"){ if(confirmReset) confirmReset = false; else setState("title"); }
  else if(state === "win" && !giftQueue.length) setState("map");
}
window.addEventListener("popstate", () => { backArmed = false; goBack(); if(state !== "title") armBack(); });

/* ---------- Toques ---------- */
const hit = (id, lx, ly) => { const b = BTN[id]; return !!b && lx >= b.x && lx <= b.x + b.w && ly >= b.y && ly <= b.y + b.h; };
function play(){ reset(); setState("count"); wake(); }
function onTap(lx, ly, now){
  audioInit(); loadClips(); armBack();
  if(state !== "play" && state !== "meet" && state !== "count") goFull();
  if(state === "title"){
    if(hit("fases", lx, ly)) setState("map");
    else if(hit("opcoes", lx, ly)) setState("opcoes");
    else if(hit("album", lx, ly)) setState("album");
    else { startPhase(nextPhase()); setState("intro"); }
    return;
  }
  if(state === "count"){ if(hit("pausa", lx, ly)) pauseGame(); return; }
  if(state === "pause"){
    if(stateT < 0.25) return;
    if(hit("continuar", lx, ly)) resume();
    else if(hit("reiniciar", lx, ly)) play();
    else if(hit("fases", lx, ly)) setState("map");
    else if(hit("som", lx, ly)) setOpt("som", !opts.som);
    else if(hit("vib", lx, ly)) setOpt("vib", !opts.vib);
    return;
  }
  if(state === "opcoes"){
    if(confirmReset){
      if(hit("cancelar", lx, ly)) confirmReset = false;
      else if(hit("apagar", lx, ly) && clock - confirmAt > 0.4){ resetJourney(); setState("title"); floatText("Jornada recomeçada", W / 2, H * 0.55, C.ouro); }
      return;
    }
    if(hit("voltar", lx, ly)) setState("title");
    else if(hit("som", lx, ly)) setOpt("som", !opts.som);
    else if(hit("vib", lx, ly)) setOpt("vib", !opts.vib);
    else if(hit("recomecar", lx, ly)){ confirmReset = true; confirmAt = clock; }
    return;
  }
  if(state === "replay"){ if(stateT > 1.2) setState("item"); return; }
  if(state === "map"){
    if(hit("voltar", lx, ly)){ setState("title"); return; }
    for(let k = 0; k < PHASES.length; k++) if(hit("fase" + k, lx, ly)){ if(k < prog.unlocked){ startPhase(k); setState("intro"); } return; }
    return;
  }
  if(state === "intro"){
    if(hit("voltar", lx, ly)) setState("map"); else play();
    return;
  }
  if(state === "album"){
    if(hit("voltar", lx, ly)){ setState("title"); return; }
    for(let k = 0; k < ITEMS.length; k++) if(hit("item" + k, lx, ly)){
      detail = k; setState("item");
      if(ITEMS[k].id === "caixinha" && collected.includes("caixinha")) SFX.tango();
      return;
    }
    return;
  }
  if(state === "item"){
    if(hit("reabrir", lx, ly) && collected.includes(ITEMS[detail].id)) setState("replay"); else setState("album");
    return;
  }
  if(state === "play"){
    if(hit("pausa", lx, ly)){ pauseGame(); return; }
    const i = lx < W / 2 ? 0 : 1, o = 1 - i;
    if(lanes[i].done) return;
    taps[i]++; flap(i);
    if(lastTap[o] >= 0 && now - lastTap[o] <= SYNC_MS && !lanes[o].done){
      lastTap[o] = -1; lastTap[i] = -1; syncs++; kisses++; SFX.chord(); kissFx();
      if(kisses % KISSES_PER_HEART === 0 && hearts < 3){ hearts++; SFX.heartBack(); floatText("+1 coração", W / 2, H * 0.34, C.red); }
    }else lastTap[i] = now;
    return;
  }
  if(state === "over" && stateT > 0.5){
    if(hit("fases", lx, ly)) setState("map"); else if(hit("repetir", lx, ly)) play();
    return;
  }
  if(state === "win" && giftQueue.length){ // o presente aparece por cima e precisa ser guardado antes dos botões
    if(showingGift() && giftT > 1.2){ giftQueue.shift(); giftT = 0; giftOpened = false; }
    return;
  }
  if(state === "win" && stateT > 0.8){
    if(hit("fases", lx, ly)) setState("map");
    else if(hit("repetir", lx, ly)) play();
    else if(hit("proxima", lx, ly)){ startPhase(phase + 1); setState("intro"); }
    else if(hit("album", lx, ly)) setState("album");
  }
}
cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  onTap(rot ? y : x, rot ? sw - x : y, performance.now());
}, { passive: false });
window.addEventListener("keydown", e => {
  if(e.repeat) return;
  const k = e.key.toLowerCase();
  if(k === "a" || k === "arrowleft") onTap(W * 0.25, H / 2, performance.now());
  else if(k === "l" || k === "arrowright") onTap(W * 0.75, H / 2, performance.now());
  else if(k === "escape" || k === "p"){ if(playing()) pauseGame(); else if(state === "pause") resume(); }
});

/* ---------- Desenho ---------- */
function drawLane(L){
  const P = PHASES[phase];
  ctx.save();
  ctx.beginPath(); ctx.rect(L.i === 0 ? 0 : LW, 0, LW, H); ctx.clip();
  if(L.i === 1){ ctx.translate(W, 0); ctx.scale(-1, 1); }
  P.bg(L);
  L.obs.forEach(o => {
    const top = o.c * H - o.h / 2, bot = o.c * H + o.h / 2;
    ctx.save(); P.top(o, o.x, OW, top); ctx.restore();
    if(bot < GROUND - 8){ ctx.save(); P.bottom(o, o.x, OW, bot); ctx.restore(); }
  });
  P.ground(L);
  ctx.restore();
}
function drawBotos(){
  lanes.forEach(L => {
    const a = L.inv > 0 && Math.floor(clock * 14) % 2 ? 0.35 : 1;
    drawBoto(sx(L, L.x), L.y, R, L.i === 0 ? C.rosa : C.cara, L.i === 0 ? C.rosaB : C.caraB, L.i === 0 ? 1 : -1, L.tilt, L.sq, clock + L.i * 0.7, a);
  });
}
function drawParts(){
  parts.forEach(p => {
    const k = 1 - p.life / p.max;
    ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, k * 1.5));
    if(p.type === "drop"){ ctx.fillStyle = C.water; ctx.strokeStyle = C.ink; ctx.lineWidth = 2; circ(p.x, p.y, p.s); ctx.fill(); ctx.stroke(); }
    else if(p.type === "bubble"){ ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 2; circ(p.x, p.y, p.s + (1 - k) * 3); ctx.stroke(); }
    else if(p.type === "spark"){ sparkle(p.x, p.y, p.s, C.ouro); }
    else if(p.type === "heart"){ ctx.fillStyle = C.red; ctx.strokeStyle = C.ink; ctx.lineWidth = 2; heartPath(p.x, p.y, p.s); ctx.fill(); ctx.stroke(); }
    else if(p.type === "text"){ txt(p.txt, p.x, p.y, p.s, p.color); }
    ctx.restore();
  });
}
function drawHUD(){
  ctx.save(); ctx.strokeStyle = "rgba(255,255,255,0.75)"; ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.setLineDash([2, 14]);
  ctx.beginPath(); ctx.moveTo(W / 2, H * 0.3); ctx.lineTo(W / 2, GROUND - 6); ctx.stroke(); ctx.restore();
  const bw = Math.min(300, W * 0.36), bh = 34, bx = W / 2 - bw / 2, by = 12, half = bw / 2 - bh / 2, cy = by + bh / 2;
  ctx.fillStyle = "rgba(46,31,71,0.8)"; rr(bx, by, bw, bh, bh / 2); ctx.fill();
  ctx.lineCap = "round"; ctx.lineWidth = 5;
  ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.beginPath(); ctx.moveTo(bx + bh / 2, cy); ctx.lineTo(bx + bw - bh / 2, cy); ctx.stroke();
  const p0 = lanes[0].passed / N, p1 = lanes[1].passed / N;
  ctx.strokeStyle = C.rosa; ctx.beginPath(); ctx.moveTo(bx + bh / 2, cy); ctx.lineTo(bx + bh / 2 + half * p0 + 0.01, cy); ctx.stroke();

/* ---------- Laço principal ---------- */
function update(dt){
  if(state === "pause") return; // tudo congelado
  ambUpdate(dt);
  if(state === "replay" && !replayOpened && stateT > 0.7){ replayOpened = true; SFX.gift(); vibrate([20, 40, 20]); }
  if(state === "count"){
    const n = Math.floor(stateT / COUNT_STEP);
    if(n >= 3){ setState("play"); SFX.count(true); floatText("Vai!", W / 2, H * 0.5, C.ouro); }
    else if(n >= countN){ countN = n + 1; SFX.count(false); }
  }
  if(state === "win"){
    if(result && result.n === 3 && !yayPlayed && stateT > 0.8){ yayPlayed = true; playClip("yay"); }
    if(showingGift()){ giftT += dt; if(!giftOpened && giftT > 0.7){ giftOpened = true; SFX.gift(); vibrate([20, 40, 20]); } }
  }
  if(state === "play"){
    tPlay += dt;
    lanes.forEach(L => updateLane(L, dt));
    if(state === "play" && lanes[0].done && lanes[1].done) setState("meet");
  }else if(state === "meet"){
    lanes.forEach(L => {
      L.scroll += V * dt * 0.3; L.obs.forEach(o => o.x -= V * dt);
      L.x = lerp(L.x, LW - R * 1.35, dt * 3); L.y = lerp(L.y, H * 0.5, dt * 3); L.tilt *= 0.9; L.sq = Math.max(0, L.sq - dt * 5);
    });
    if(stateT > 0.8 && !meetBurst){ meetBurst = true; heartBurst(); SFX.win(); vibrate([30, 60, 30]); }
    if(stateT > 2.6){ finish(); setState("win"); }
  }else if(state === "count"){
    lanes.forEach(L => { L.sq = Math.max(0, L.sq - dt * 5); }); // parados esperando a largada
  }else{
    lanes.forEach(L => {
      L.scroll += V * dt * 0.25;
      L.y = lerp(L.y, H * 0.45 + Math.sin(clock * 2.5 + L.i * 1.3) * H * 0.04, dt * 4);
      L.tilt = Math.sin(clock * 2.5 + L.i * 1.3) * 0.15; L.sq = Math.max(0, L.sq - dt * 5);
      if(L.inv > 0) L.inv -= dt;
    });
  }
  parts.forEach(p => { p.life += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if(p.type === "heart" && !p.g) p.vx *= 0.96; });
  parts = parts.filter(p => p.life < p.max);
  shake = Math.max(0, shake - dt);
}
function draw(){
  for(const k in BTN) delete BTN[k];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, sw, sh);
  if(rot){ ctx.translate(sw, 0); ctx.rotate(Math.PI / 2); }
  if(shake > 0) ctx.translate((Math.random() - 0.5) * 16 * shake / 0.3, (Math.random() - 0.5) * 16 * shake / 0.3);
  drawLane(lanes[0]); drawLane(lanes[1]);
  ambDraw();
  drawBotos(); drawParts();
  if(state === "play" || state === "meet") drawHUD();
  else if(state === "count"){ drawHUD(); drawCount(); }
  else if(state === "pause"){ drawHUD(); for(const k in BTN) delete BTN[k]; drawPause(); }
  else if(state === "opcoes") drawOptions();
  else if(state === "replay") drawReplay();
  else if(state === "title") drawTitle();
  else if(state === "map") drawMap();
  else if(state === "intro") drawIntro();
  else if(state === "over") drawOver();
  else if(state === "win") drawWin();
  else if(state === "album") drawAlbum();
  else if(state === "item") drawDetail();
}
let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;
  clock += dt; stateT += dt;
  update(dt); draw();
  requestAnimationFrame(frame);
}
startPhase(nextPhase());
requestAnimationFrame(frame);
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
window.BT = { get btn(){ return BTN; }, get opts(){ return opts; }, get master(){ return master ? master.gain.value : null; }, get hearts(){ return hearts; }, get tPlay(){ return tPlay; }, get state(){ return state; }, get lanes(){ return lanes; }, get prog(){ return prog; }, get gifts(){ return giftQueue; }, get collected(){ return collected; }, get clips(){ return Object.keys(CLIPS).filter(k => CLIPS[k]); }, setState, startPhase, reset, finish, onTap, play, setResult: (crashesN, syncRate, time) => { crashes = crashesN; taps = [10, 10]; syncs = Math.round(syncRate * 10); tPlay = time; } };
})();
